name: Data release

# Builds the GenCC SQLite index reproducibly from ONE download of the upstream
# export (`gencc-link-data build --reproducible`) and publishes it as an
# immutable, attested, content-addressed GitHub release (`data-gencc-<sha16>`).
# An unchanged export rebuilds to the same bytes and the same tag, so it is
# never published twice. Publication waits on the `data-release` environment
# (owner review, `main` only); the `release` environment stays restricted to
# `v*.*.*` tags. The owner's redistribution authorization is read from
# release/data-authorization.json and ships as a release asset. The app pins a
# published tag + digest in a reviewed PR; nothing here changes what runs.

on:
  schedule:
    # GenCC publishes its export weekly (Sunday); check Monday morning.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gencc-data-release
  cancel-in-progress: false

jobs:
  build:
    name: Build data release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.8.7"
      - run: uv sync --frozen --no-dev
      - name: Download once and build reproducibly, without publish credentials
        env:
          GENCC_LINK_DATA__DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -euo pipefail
          uv run --frozen --no-dev gencc-link-data build --reproducible
          uv run --frozen --no-dev gencc-link-data package \
            --output "$RUNNER_TEMP/release" --revision "$GITHUB_SHA" > "$RUNNER_TEMP/manifest.json"
      - name: Verify assets and resolve the content-addressed tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          test "$(ls -A | LC_ALL=C sort | paste -sd,)" = "SHA256SUMS,data-authorization.json,gencc.sqlite.gz,manifest.json"
          sha256sum --check SHA256SUMS
          cmp manifest.json "$RUNNER_TEMP/manifest.json"
          tag="$(jq -er '.release_tag | select(test("^data-gencc-[0-9a-f]{16}$"))' manifest.json)"
          jq -er --arg rev "$GITHUB_SHA" '.transformation.revision == $rev' manifest.json >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only a published release counts; a leftover draft is replaced by publish.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already published; the upstream export is unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          jq -r '"GenCC data snapshot `\(.release_tag)` (research use only; not clinical decision support).\n\n- Upstream: \(.source.url) (Last-Modified \(.source.last_modified), sha256 `\(.source.sha256)`), GenCC run date \(.source.gencc_run_date).\n- \(.record_counts.submissions) submissions, \(.record_counts.genes) genes, \(.record_counts.diseases) diseases, \(.record_counts.submitters) submitters; data schema \(.data_schema_version).\n- Built by `gencc-link-data build --reproducible` from commit `\(.transformation.revision)`.\n- `gencc.sqlite.gz` sha256 `\(.compressed_sha256)` (this is the digest the app pins); expanded sha256 `\(.expanded_sha256)`.\n- License: \(.license.spdx) (\(.license.terms_url)). Redistribution authorized by \(.authorization.reviewer) on \(.authorization.reviewed_at); see data-authorization.json. This records the repository owner decision, not an approval by GenCC.\n\nAttribution: \(.attribution)"' \
            manifest.json > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gencc-data-${{ steps.meta.outputs.tag }}
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish data release
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: data-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gencc-data-${{ needs.build.outputs.tag }}
          path: dist
      - name: Verify transferred bytes
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Create a draft, upload and verify every asset, then publish
        run: |
          set -euo pipefail
          cd dist/release
          assets=(gencc.sqlite.gz manifest.json data-authorization.json SHA256SUMS)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" \
            | while read -r stale; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$stale"; done
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file ../release-notes.md
          remote="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft == true)] | first")"
          for asset in "${assets[@]}"; do
            digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            jq -e --arg n "$asset" --arg d "$digest" --argjson s "$(stat -c %s "$asset")" \
              '[.assets[] | select(.name == $n and .size == $s and .digest == $d)] | length == 1' \
              <<<"$remote" >/dev/null
          done
          jq -e '.assets | length == 4' <<<"$remote" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | jq -e --arg sha "$GITHUB_SHA" '.draft == false and .target_commitish == $sha and (.assets | length) == 4' >/dev/null
