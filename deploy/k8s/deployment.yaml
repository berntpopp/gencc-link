# GenCC-Link on Kubernetes: restore the pinned data release, then serve it read-only.
#
#   - the initContainer runs `gencc-link-data materialize-data`: it downloads the
#     image's pinned `data-gencc-*` GitHub release asset, verifies its digests,
#     and selects it as /data/current (no thegencc.org download, no refresh)
#   - the server mounts the PVC read-only and reports the served release in
#     /health `release_identity`
#   - pin the image by digest; a new data release arrives with a new image.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gencc-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gencc-link
  labels: { app: gencc-link }
spec:
  replicas: 1
  # Recreate (not RollingUpdate): a ReadWriteOnce PVC cannot attach to two pods.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gencc-link }
  template:
    metadata:
      labels: { app: gencc-link }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      initContainers:
        - name: restore-data
          image: ghcr.io/berntpopp/gencc-link@sha256:<digest>
          command: ["gencc-link-data", "materialize-data"]
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: server
          image: ghcr.io/berntpopp/gencc-link@sha256:<digest>
          args: ["python", "server.py", "--transport", "unified", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: GENCC_LINK_HOST, value: "0.0.0.0" }
            - { name: GENCC_LINK_LOG_FORMAT, value: json }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gencc-data
---
apiVersion: v1
kind: Service
metadata:
  name: gencc-link
spec:
  selector: { app: gencc-link }
  ports:
    - { port: 80, targetPort: http, name: http }
