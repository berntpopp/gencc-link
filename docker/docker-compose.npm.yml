# Nginx Proxy Manager deployment overlay for gencc-link.
#
# Self-contained (used standalone, not layered on docker-compose.yml): one
# unified container serves the FastAPI REST API on / and the MCP streamable-HTTP
# transport on /mcp via a single port (8000). NPM reverse-proxies to the fixed
# container_name on the shared external npm_default network. Mirrors the
# gtex-link / clingen-link pattern.
#
#   docker compose -f docker/docker-compose.npm.yml --env-file .env.docker up -d --build
name: gencc-link-npm

services:
  # Restores the pinned, digest-verified GenCC data release (a `data-gencc-*`
  # GitHub release of this repo) into the volume and exits; only the private
  # stack network, no proxy network. No thegencc.org download at boot.
  gencc-data-init:
    image: ${GENCC_LINK_IMAGE:?Set GENCC_LINK_IMAGE to ghcr.io/berntpopp/gencc-link@sha256:<digest>}
    pull_policy: missing
    command: ["gencc-link-data", "materialize-data"]
    environment:
      - GENCC_LINK_IMMUTABLE_DATA__REFERENCE_ROOT=/data
    volumes:
      - gencc-data:/data
    networks:
      - gencc_link_internal_net
    restart: "no"
    # This image's own uid:gid (docker/Dockerfile); same as the server.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  gencc_link:
    # Deploy pulls the released, attested image; it never builds from source.
    # Pin a digest, not a tag: there is no `latest`, and only a digest is immutable.
    image: ${GENCC_LINK_IMAGE:?Set GENCC_LINK_IMAGE to ghcr.io/berntpopp/gencc-link@sha256:<digest>}
    pull_policy: missing
    container_name: gencc-link-npm
    depends_on:
      gencc-data-init:
        condition: service_completed_successfully
    # NO published host ports - NPM handles all routing via the container name.
    expose:
      - "8000"
    environment:
      - GENCC_LINK_HOST=0.0.0.0
      - GENCC_LINK_PORT=8000
      - GENCC_LINK_TRANSPORT=unified
      - GENCC_LINK_MCP_PATH=/mcp
      - GENCC_LINK_LOG_LEVEL=${LOG_LEVEL_API:-INFO}
      - GENCC_LINK_LOG_FORMAT=json
      - GENCC_LINK_RELOAD=false
      - 'GENCC_LINK_ALLOWED_HOSTS=["localhost","127.0.0.1","::1","gencc-link.genefoundry.org"]'
      # Serve the release restored by gencc-data-init, read-only.
      - GENCC_LINK_DATA__DATA_DIR=/data
      - GENCC_LINK_DATA__DB_FILENAME=current/gencc.sqlite
      - GENCC_LINK_DATA__AUTO_BOOTSTRAP=false
      - GENCC_LINK_DATA__REFRESH_ENABLED=false
      - GENCC_LINK_DATA__CACHE_SIZE=${GENCC_CACHE_SIZE:-2000}
      - GENCC_LINK_DATA__CACHE_TTL=${GENCC_CACHE_TTL:-7200}
    # env_file provided via the --env-file flag for consistency with siblings.
    command: ["python", "server.py", "--transport", "unified", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # GeneFoundry deploy contract: the fleet controller (strato_v6_docker_npm,
    # scripts/utils/deployment_preflight.py) accepts a declared user only as numeric
    # non-root, and its runtime observer proves the effective uid from /proc.
    # This is THIS image's own uid:gid (docker/Dockerfile) -- sibling -link images differ.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    volumes:
      - gencc-data:/data:ro
    networks:
      - gencc_link_internal_net
      - npm_proxy_network
    deploy:
      resources:
        limits:
          memory: ${GENCC_API_MEMORY_LIMIT:-1g}
          cpus: ${GENCC_API_CPU_LIMIT:-1.0}
          pids: 256
        reservations:
          memory: 256m
          cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=gencc-link,environment=production,proxy=npm"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true

volumes:
  gencc-data:
    driver: local

networks:
  gencc_link_internal_net:
    driver: bridge
    name: gencc_link_internal_net
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:-npm_default}
