name: gencc-link

services:
  # Restores the pinned GenCC data release (a `data-gencc-*` GitHub release of
  # this repo, digest-verified) into the volume, then exits. Pins live in
  # gencc_link/config.py and container-release.json; nothing is downloaded from
  # thegencc.org at boot.
  gencc-data-init:
    build: &build
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        VCS_REF: ${VCS_REF:-0000000000000000000000000000000000000000}
        BUILD_DATE: ${BUILD_DATE:-1970-01-01T00:00:00Z}
    image: gencc-link:latest
    command: ["gencc-link-data", "materialize-data"]
    environment:
      GENCC_LINK_IMMUTABLE_DATA__REFERENCE_ROOT: /data
    volumes:
      - gencc-data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gencc-network

  gencc-link:
    build: *build
    image: gencc-link:latest
    container_name: gencc-link
    depends_on:
      gencc-data-init:
        condition: service_completed_successfully
    # Dev/local only — loopback-bound (127.0.0.1) so copying this file to a
    # server never publishes the unauthenticated backend on the public IP
    # (Docker would otherwise bind 0.0.0.0 and bypass the host firewall).
    # Production fronts the container with a reverse proxy via the prod/npm
    # overlays (ports: !reset []). Backends are unauthenticated by design.
    ports:
      - "127.0.0.1:${GENCC_LINK_HOST_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      GENCC_LINK_HOST: 0.0.0.0
      GENCC_LINK_PORT: 8000
      GENCC_LINK_TRANSPORT: unified
      GENCC_LINK_MCP_PATH: /mcp
      GENCC_LINK_LOG_LEVEL: INFO
      GENCC_LINK_LOG_FORMAT: json
      # Serve the restored release read-only (see docs/data-lifecycle.md).
      GENCC_LINK_DATA__DATA_DIR: /data
      GENCC_LINK_DATA__DB_FILENAME: current/gencc.sqlite
      GENCC_LINK_DATA__AUTO_BOOTSTRAP: "false"
      GENCC_LINK_DATA__REFRESH_ENABLED: "false"
    volumes:
      - gencc-data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gencc-network

volumes:
  gencc-data:
    driver: local

networks:
  gencc-network:
    driver: bridge
